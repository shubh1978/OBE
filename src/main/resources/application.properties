# ─── Database ────────────────────────────────────────────────────────────────
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  ENV SWITCH — change these when moving between LOCAL / PRODUCTION        │
# │                                                                          │
# │  ✅ LOCAL  : currently active (uses local PostgreSQL)                    │
# │  🚀 PROD   : on Render, set DB_URL / DB_USERNAME / DB_PASSWORD           │
# │             as environment variables in the Render dashboard             │
# └─────────────────────────────────────────────────────────────────────────┘

# ── ✅ LOCAL ──────────────────────────────────────────────────────────────────
# Uses local PostgreSQL. Change username/password to match your local setup.
# DB_URL       default → jdbc:postgresql://localhost:5432/obe
# DB_USERNAME  default → shubhsinghal
# DB_PASSWORD  default → postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/obe}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:shubhsinghal}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
# ── END LOCAL ─────────────────────────────────────────────────────────────────

# ── 🚀 PRODUCTION (Render) ────────────────────────────────────────────────────
# On Render dashboard, add these environment variables:
#   DB_URL      = jdbc:postgresql://<host>:5432/<dbname>?sslmode=require
#   DB_USERNAME = <your db user>
#   DB_PASSWORD = <your db password>
# ── END PRODUCTION ────────────────────────────────────────────────────────────


# ─── Connection Pool ─────────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Server ──────────────────────────────────────────────────────────────────
# Render injects PORT automatically
server.port=${PORT:8080}

# ─── Performance ─────────────────────────────────────────────────────────────
# Lazy init cuts startup from ~112s to ~15s — critical for Render's health check
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false

# ─── File Upload ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB